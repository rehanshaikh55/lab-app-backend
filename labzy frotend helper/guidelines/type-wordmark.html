<!-- @dsCard group="Type" viewport="700x150" name="Wordmark face" subtitle="Montserrat ExtraBold Italic — nearest Google match; wordmark lockup only, never UI text" -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--surface-card); padding: 24px 16px; display: flex; align-items: center; gap: 32px; }
  .mark { font-family: var(--font-logo); font-style: italic; font-weight: 800; font-size: 44px; letter-spacing: -0.01em; }
  .note { font-size: 12px; color: var(--text-secondary); max-width: 280px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="mark"><span style="color: var(--teal-500);">LAB</span><span style="color: var(--logo-charcoal);">ZY</span></div>
  <p class="note">Two-tone split is fixed: <strong>LAB</strong> in teal-500, <strong>ZY</strong> in charcoal. Use the CSS lockup or the PNG assets — never re-set in other faces.</p>
</body>
</html>
