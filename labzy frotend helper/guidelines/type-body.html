<!-- @dsCard group="Type" viewport="700x190" name="Body & captions" subtitle="Manrope 400–600 · 1.45 leading" -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--surface-card); padding: 20px 16px; display: flex; flex-direction: column; gap: 12px; }
  .spec { display: flex; align-items: baseline; gap: 16px; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); min-width: 120px; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="spec"><span class="meta">--text-base · 15/400</span><p style="font-size: var(--text-base); color: var(--text-primary); max-width: 460px;">Your phlebotomist will arrive between 7:00–7:30 AM. Fasting for 10–12 hours is required for this test.</p></div>
  <div class="spec"><span class="meta">--text-base · 15/600</span><p style="font-size: var(--text-base); font-weight: var(--weight-semibold);">Emphasized body — list titles, key facts</p></div>
  <div class="spec"><span class="meta">--text-sm · 13/500</span><p style="font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--text-secondary);">Caption — hints, metadata, timestamps</p></div>
  <div class="spec"><span class="meta">--text-xs · 11/700</span><p style="font-size: var(--text-xs); font-weight: var(--weight-bold); letter-spacing: var(--tracking-overline); text-transform: uppercase; color: var(--text-muted);">Overline · Section label</p></div>
</body>
</html>
