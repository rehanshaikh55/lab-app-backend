<!-- @dsCard group="Spacing" viewport="700x150" name="Space scale" subtitle="4px grid · --space-1 … --space-16" -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--surface-card); padding: 20px 16px; display: flex; align-items: flex-end; gap: 14px; }
  .bar { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .blk { width: 28px; background: var(--teal-500); border-radius: 3px; }
  .lbl { font-family: var(--font-mono); font-size: 9px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="bar"><div class="blk" style="height: 4px; background: var(--teal-200);"></div><span class="lbl">1·4</span></div>
  <div class="bar"><div class="blk" style="height: 8px; background: var(--teal-300);"></div><span class="lbl">2·8</span></div>
  <div class="bar"><div class="blk" style="height: 12px; background: var(--teal-400);"></div><span class="lbl">3·12</span></div>
  <div class="bar"><div class="blk" style="height: 16px;"></div><span class="lbl">4·16</span></div>
  <div class="bar"><div class="blk" style="height: 20px;"></div><span class="lbl">5·20</span></div>
  <div class="bar"><div class="blk" style="height: 24px;"></div><span class="lbl">6·24</span></div>
  <div class="bar"><div class="blk" style="height: 32px;"></div><span class="lbl">8·32</span></div>
  <div class="bar"><div class="blk" style="height: 40px; background: var(--teal-600);"></div><span class="lbl">10·40</span></div>
  <div class="bar"><div class="blk" style="height: 48px; background: var(--teal-700);"></div><span class="lbl">12·48</span></div>
  <div class="bar"><div class="blk" style="height: 64px; background: var(--teal-800);"></div><span class="lbl">16·64</span></div>
</body>
</html>
