<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--surface-page); padding: 24px 16px; display: flex; gap: 24px; align-items: center; }
  .e { width: 140px; height: 96px; background: var(--surface-card); border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 2px; }
  .n { font-size: 12px; font-weight: var(--weight-bold); }
  .u { font-family: var(--font-mono); font-size: 9px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="e" style="box-shadow: var(--shadow-card);"><span class="n">card</span><span class="u">--shadow-card</span></div>
  <div class="e" style="box-shadow: var(--shadow-raised);"><span class="n">raised</span><span class="u">--shadow-raised</span></div>
  <div class="e" style="background: var(--teal-500); box-shadow: var(--shadow-fab); width: 96px; border-radius: var(--radius-full);"><span class="n" style="color:#fff;">FAB</span><span class="u" style="color: var(--teal-100);">--shadow-fab</span></div>
</body>
</html>
