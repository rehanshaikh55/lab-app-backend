<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { background: var(--surface-card); padding: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .tile { border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; height: 120px; padding: 16px; }
  .tile img { max-width: 100%; max-height: 56px; }
</style>
</head>
<body>
  <div class="tile" style="background: #fff; border: 1px solid var(--border-default);"><img src="../assets/brand/labzy-wordmark-transparent.png" alt="Labzy wordmark on white"></div>
  <div class="tile" style="background: var(--teal-500);"><img src="../assets/brand/labzy-wordmark-white.png" alt="Labzy wordmark white on teal"></div>
  <div class="tile" style="background: var(--neutral-900);"><img src="../assets/brand/labzy-wordmark-white.png" alt="Labzy wordmark white on dark"></div>
</body>
</html>
