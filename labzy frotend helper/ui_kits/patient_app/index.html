function Ico({n,s=20,c='currentColor',w=1.8,st}){
  return <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth={w} strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0,...st}}>{(IC[n]||[]).map(([tag,a],i)=>React.createElement(tag,{key:i,...a}))}</svg>;
}

function Logo({sz=22}){
  return <span style={{fontFamily:f,fontStyle:'italic',fontWeight:800,fontSize:sz,letterSpacing:'-0.02em',lineHeight:1,userSelect:'none'}}><span style={{color:T.brand}}>LAB</span><span style={{color:T.fg}}>ZY</span></span>;
}

function Av({name='',sz=40,style}){
  const palette=[T.brand,'#2563EB','#7C3AED','#D97706','#DB2777','#15803D'];
  const initials=name.split(' ').map(w=>w[0]).filter(Boolean).slice(0,2).join('').toUpperCase()||'?';
  return <span style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:sz,height:sz,borderRadius:999,background:palette[(name.charCodeAt(0)||0)%palette.length],color:'#fff',fontSize:sz*.36,fontWeight:700,flexShrink:0,...style}}>{initials}</span>;
}

function Tag({tone='neutral',dot,children}){
  const map={neutral:{bg:T.surfLow,fg:T.fg3},brand:{bg:T.brandSurf,fg:T.brand2},ok:{bg:T.okS,fg:T.ok},warn:{bg:T.warnS,fg:T.warn},err:{bg:T.errS,fg:T.err},info:{bg:T.infoS,fg:T.info},purple:{bg:T.purpleS,fg:T.purple},booked:{bg:T.infoS,fg:T.info},sampled:{bg:T.purpleS,fg:T.purple},processing:{bg:T.warnS,fg:T.warn},ready:{bg:T.okS,fg:T.ok},cancelled:{bg:T.errS,fg:T.err}};
  const t=map[tone]||map.neutral;
  return <span style={{display:'inline-flex',alignItems:'center',gap:4,height:22,padding:'0 8px',borderRadius:99,fontSize:10,fontWeight:700,background:t.bg,color:t.fg,whiteSpace:'nowrap'}}>
    {dot&&<span style={{width:5,height:5,borderRadius:999,background:'currentColor'}}/>}{children}
  </span>;
}

function Chip({active,children,onClick}){
  return <button onClick={onClick} style={{height:34,padding:'0 14px',borderRadius:99,fontSize:12,fontWeight:600,border:`1.5px solid ${active?T.brand:T.border}`,background:active?T.brandSurf:'#fff',color:active?T.brand2:T.fg3,transition:'all 120ms',whiteSpace:'nowrap'}}>{children}</button>;
}

const BV={
  primary:{bg:T.brand,fg:'#fff',hov:T.brand2,bor:'transparent'},
  secondary:{bg:T.brandSurf,fg:T.brand2,hov:T.brandSurf2,bor:T.brandSurf2},
  outline:{bg:'#fff',fg:T.fg,hov:'#F9FAFB',bor:T.border},
  ghost:{bg:'transparent',fg:T.brand2,hov:T.brandSurf,bor:'transparent'},
};
const BS={sm:{h:36,px:'0 14px',fs:12,g:5,is:15},md:{h:44,px:'0 18px',fs:14,g:7,is:17},lg:{h:50,px:'0 20px',fs:15,g:8,is:18}};
function Btn({variant='primary',size='md',icon,fw,disabled,children,style,onClick}){
  const [hv,sh2]=React.useState(false);const[pr,sp]=React.useState(false);
  const v=BV[variant]||BV.primary;const s=BS[size]||BS.md;
  return <button disabled={disabled} onClick={disabled?undefined:onClick} onMouseEnter={()=>sh2(true)} onMouseLeave={()=>{sh2(false);sp(false)}} onMouseDown={()=>sp(true)} onMouseUp={()=>sp(false)} style={{display:fw?'flex':'inline-flex',width:fw?'100%':undefined,alignItems:'center',justifyContent:'center',gap:s.g,height:s.h,padding:s.px,fontSize:s.fs,fontWeight:700,borderRadius:12,border:`1.5px solid ${v.bor}`,background:hv&&!disabled?v.hov:v.bg,color:v.fg,opacity:disabled?.45:1,transform:pr&&!disabled?'scale(0.97)':'scale(1)',transition:'all 140ms',...style}}>{icon&&<Ico n={icon} s={s.is}/>}{children}</button>;
}

/* ── LIQUID GLASS TAB BAR ── */
function TabBar({tabs,active,onChange}){
  return(
    <div style={{
      position:'absolute',bottom:22,left:'50%',transform:'translateX(-50%)',
      width:'calc(100% - 28px)',maxWidth:386,
      background:'rgba(248,250,250,0.52)',
      backdropFilter:'blur(72px) saturate(300%) brightness(1.06)',
      WebkitBackdropFilter:'blur(72px) saturate(300%) brightness(1.06)',
      borderRadius:34,
      border:'1px solid rgba(255,255,255,0.88)',
      boxShadow:'0 32px 64px rgba(0,0,0,.09),0 8px 20px rgba(0,0,0,.06),0 2px 4px rgba(0,0,0,.04),inset 0 2px 0 rgba(255,255,255,1),inset 0 -1px 0 rgba(160,190,185,.14),inset 1px 0 0 rgba(255,255,255,.5),inset -1px 0 0 rgba(255,255,255,.5)',
      padding:'5px 5px',display:'flex',zIndex:200,overflow:'hidden',
    }}>
      {/* frosted inner gradient layer */}
      <div style={{position:'absolute',inset:0,borderRadius:34,background:'linear-gradient(175deg,rgba(255,255,255,0.55) 0%,rgba(255,255,255,0.08) 60%,rgba(20,149,132,0.04) 100%)',pointerEvents:'none',zIndex:0}}/>
      {tabs.map(t=>{
        const on=t.key===active;
        return <button key={t.key} onClick={()=>onChange(t.key)} style={{
          flex:1,minHeight:54,position:'relative',zIndex:1,
          display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:3,
          background:on?'linear-gradient(150deg,rgba(20,149,132,0.14) 0%,rgba(20,149,132,0.06) 100%)':'transparent',
          borderRadius:28,
          color:on?T.brand2:'rgba(17,24,39,.30)',
          transition:'all 230ms cubic-bezier(.2,.8,.3,1)',
          boxShadow:on?'inset 0 1px 0 rgba(255,255,255,0.9),inset 0 -0.5px 0 rgba(20,149,132,.1),0 2px 8px rgba(20,149,132,.08)':'none',
        }}>
          {t.badge>0&&<span style={{position:'absolute',top:9,right:'16%',minWidth:16,height:16,padding:'0 3px',borderRadius:99,background:T.err,color:'#fff',fontSize:9,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',border:'1.5px solid rgba(248,250,250,.85)',boxShadow:'0 1px 5px rgba(220,38,38,.35)'}}>{t.badge}</span>}
          <Ico n={t.icon} s={22} w={on?2.4:1.8}/>
          <span style={{fontSize:9.5,fontWeight:on?700:500,letterSpacing:on?'-.01em':'0',lineHeight:1}}>{t.label}</span>
        </button>;
      })}
    </div>
  );
}

/* ── SCREEN SHELL ── */
function ScreenHead({title,sub,onBack,right,bg='#fff'}){
  return(
    <div style={{background:bg,borderBottom:`1px solid ${T.borderS}`,paddingTop:14}}>
      <div style={{display:'flex',alignItems:'center',gap:8,height:46,padding:'0 16px'}}>
        {onBack&&<button onClick={onBack} style={{width:36,height:36,borderRadius:10,background:T.surfLow,display:'flex',alignItems:'center',justifyContent:'center',marginLeft:-4}}><Ico n="chevron-left" s={18} c={T.fg}/></button>}
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:17,fontWeight:800,color:T.fg,letterSpacing:'-0.02em',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{title}</div>
          {sub&&<div style={{fontSize:11,color:T.fg3,marginTop:1}}>{sub}</div>}
        </div>
        {right}
      </div>
    </div>
  );
}

function SectionRow({title,cta}){
  return(
    <div style={{display:'flex',alignItems:'center',padding:'0 16px',marginBottom:10}}>
      <span style={{flex:1,fontSize:14,fontWeight:800,color:T.fg,letterSpacing:'-0.015em'}}>{title}</span>
      {cta&&<span style={{fontSize:12,fontWeight:700,color:T.brand,cursor:'pointer'}}>{cta}</span>}
    </div>
  );
}

                  {['Parameter','Result','Ref'].map(h=><span key={h} style={{fontSize:9,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.07em',color:T.fg4,textAlign:h!=='Parameter'?'right':undefined}}>{h}</span>)}
                  {RVALS.map(rv=><React.Fragment key={rv.n}>
                    <span style={{fontSize:12,fontWeight:500,color:T.fg}}>{rv.n}</span>
                    <span style={{fontFamily:fm,fontSize:12,fontWeight:700,textAlign:'right',color:rv.flag?T.err:T.fg}}>{rv.v}{rv.flag?' ↑':''}</span>
                    <span style={{fontFamily:fm,fontSize:10,color:T.fg4,textAlign:'right'}}>{rv.r}</span>
                  </React.Fragment>)}
                </div>
                <div style={{borderTop:`1px solid ${T.borderS}`,paddingTop:10,display:'flex',alignItems:'center',gap:10}}>
                  <div onClick={()=>setRemind(!remind)} style={{width:38,height:24,borderRadius:99,background:remind?T.brand:T.border,position:'relative',cursor:'pointer',transition:'background 200ms',flexShrink:0}}>
                    <span style={{position:'absolute',top:3,left:remind?17:3,width:18,height:18,borderRadius:99,background:'#fff',boxShadow:'0 1px 3px rgba(0,0,0,.15)',transition:'left 200ms'}}/>
                  </div>
                  <span style={{fontSize:11,color:T.fg2}}>Remind me to re-test in 3 months</span>
                </div>
              </div>
            )}
          </React.Fragment>
        ))}
      </div>
    </div>
  );
}

/* ── APP ROOT ── */
const TABS=[
  {key:'home',icon:'home',label:'Home'},
  {key:'bookings',icon:'calendar',label:'Bookings'},
  {key:'reports',icon:'file-text',label:'Reports',badge:1},
  {key:'profile',icon:'user',label:'Profile'},
];

function App(){
  const getSaved=()=>{try{return JSON.parse(localStorage.getItem('lbz_v3')||'null');}catch{return null;}};
  const init=getSaved()||{tab:'home',lab:false,cart:{},fresh:false};
  const [tab,setTab]=React.useState(init.tab);
  const [lab,setLab]=React.useState(false);
  const [cart,setCart]=React.useState(init.cart||{});
  const [fresh,setFresh]=React.useState(false);

  React.useEffect(()=>{
    try{localStorage.setItem('lbz_v3',JSON.stringify({tab,lab:false,cart,fresh:false}));}catch{}
  },[tab,cart]);

  const toggleTest=k=>setCart(c=>({...c,[k]:!c[k]}));
  const book=()=>{setLab(false);setFresh(true);setTab('bookings');};
  const goTab=k=>{setTab(k);setFresh(k==='bookings'?fresh:false);};

  let view;
  if(lab)                    view=<LabDetail onBack={()=>setLab(false)} onBook={book} cart={cart} onTest={toggleTest}/>;
  else if(tab==='home')      view=<HomeScrn onLab={()=>setLab(true)}/>;
  else if(tab==='bookings')  view=<BookingsScrn fresh={fresh}/>;
  else if(tab==='reports')   view=<ReportsScrn/>;
  else                       view=<ProfileScrn/>;

  return(
    <div style={{height:'100vh',display:'flex',flexDirection:'column',background:T.surfLow,position:'relative'}}>
      <div style={{flex:1,overflowY:'auto'}}>{view}</div>
      {!lab&&<TabBar tabs={TABS} active={tab} onChange={goTab}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
